<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>STND - Standard Procedure</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>STND</h1>
        <nav>
            <a href="#">Home</a>
            <a href="#">Shop</a>
            <a href="#">Lookbook</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <section class="hero">
        <h2>NOT TREND PROCEDURE</h2>
        <p>Deliveries Nationwide</p>
        <button>Shop Now</button>
    </section>

    <section class="products">
        <h2>Bestsellers</h2>
        <div class="product-grid">
            <!-- White Tee with Swipe -->
            <div class="product">
                <div class="slider-container" data-images='["images/white-front.jpeg", "images/white-back.jpeg"]'>
                    <img class="slider-image" src="images/white-front.jpeg" alt="Classic White Tee">
                    <button class="slider-prev">❮</button>
                    <button class="slider-next">❯</button>
                </div>
                <h3>Classic White Tee</h3>
                <p>R 450</p>
                <button class="add-to-cart">Add to Cart</button>
                <div class="swipe-hint">← swipe / click →</div>
            </div>

            <!-- Black Tee with Swipe -->
            <div class="product">
                <div class="slider-container" data-images='["images/blackFront.png", "images/blackBack.png"]'>
                    <img class="slider-image" src="images/blackFront.png" alt="Classic Black Tee">
                    <button class="slider-prev">❮</button>
                    <button class="slider-next">❯</button>
                </div>
                <h3>Classic Black Tee</h3>
                <p>R 450</p>
                <button class="add-to-cart">Add to Cart</button>
                <div class="swipe-hint">← swipe / click →</div>
            </div>

            <!-- Hoodie -->
            <div class="product">
                <img src="https://placehold.co/300x400?text=STND+Hoodie" alt="Hoodie">
                <h3>Oversized Hoodie</h3>
                <p>R 899</p>
                <button class="add-to-cart">Add to Cart</button>
            </div>

            <!-- Cargo Pants -->
            <div class="product">
                <img src="https://placehold.co/300x400?text=STND+Cargo" alt="Cargo">
                <h3>Cargo Pants</h3>
                <p>R 1 199</p>
                <button class="add-to-cart">Add to Cart</button>
            </div>
        </div>
    </section>

    <footer>
        <p>© 2026 STND — Standard Procedure. Not trend procedure.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
